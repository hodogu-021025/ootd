server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # 이름에 해시가 붙는 빌드 결과는 오래 캐시한다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router(BrowserRouter): 파일이 없는 주소(/cart, /products/3 …)는 index.html 을 주고 화면이 주소를 처리한다.
    # index.html 은 늘 새로 확인하게 해서 다시 배포하면 바로 바뀐다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
